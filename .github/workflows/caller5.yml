name: caller5
on:
  pull_request:
    branches: [main]
  issue_comment:
    types: [created]
jobs:
  validate-articles:
    if: |
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, 'retest'))
    uses: PDFtoMark/gab-poc-private-callee/.github/workflows/callee3.yml@main
    with:
      debug: true
    secrets:
      SOME_SECRET: ${{ secrets.SOME_SECRET }}
